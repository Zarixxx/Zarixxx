<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="1000" height="320" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e63946" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#e63946" stop-opacity="0"/>
    </radialGradient>
    <pattern id="stripes" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
      <rect width="6" height="12" fill="#e63946"/>
    </pattern>
    <path id="piece" d="M0,0 H34 a11,11 0 1,1 22,0 H90 V34 a11,11 0 1,0 0,22 V90 H56 a11,11 0 1,0 -22,0 H0 Z"/>
    <style>
      .flick { animation: flick 4s infinite; }
      .pulse { animation: pulse 3s ease-in-out infinite; }
      @keyframes flick { 0%,88%,100%{opacity:1} 90%{opacity:.25} 92%{opacity:1} 95%{opacity:.5} 96%{opacity:1} }
      @keyframes pulse { 0%,100%{opacity:.35} 50%{opacity:.7} }
    </style>
  </defs>

  <rect width="1000" height="320" fill="#0a0a0a"/>
  <ellipse cx="260" cy="170" rx="380" ry="170" fill="url(#glow)" class="pulse"/>

  <!-- piezas de puzzle de fondo -->
  <g fill="none" stroke="#e63946" stroke-width="2">
    <use href="#piece" transform="translate(690,30) rotate(12)" opacity=".55"/>
    <use href="#piece" transform="translate(790,110) rotate(-8) scale(1.25)" opacity=".35"/>
    <use href="#piece" transform="translate(880,30) rotate(25) scale(.8)" opacity=".5"/>
    <use href="#piece" transform="translate(840,220) rotate(-20) scale(.9)" opacity=".3"/>
  </g>
  <use href="#piece" fill="#e63946" transform="translate(735,150) rotate(-14) scale(.9)" opacity=".9"/>
  <use href="#piece" fill="#f2f2f2" transform="translate(655,205) rotate(18) scale(.6)" opacity=".9"/>

  <!-- marco -->
  <rect x="14" y="14" width="972" height="292" fill="none" stroke="#f2f2f2" stroke-opacity=".18"/>
  <g stroke="#e63946" stroke-width="3" fill="none">
    <path d="M14,44 V14 H44"/><path d="M956,14 H986 V44"/>
    <path d="M14,276 V306 H44"/><path d="M956,306 H986 V276"/>
  </g>

  <!-- franja de peligro -->
  <rect x="40" y="38" width="120" height="10" fill="url(#stripes)"/>
  <text x="172" y="48" font-family="'Courier New', monospace" font-size="13" fill="#f2f2f2" letter-spacing="3">SESION ABIERTA</text>

  <!-- nombre con glitch -->
  <text x="46" y="178" font-family="Impact, 'Arial Black', sans-serif" font-size="112" fill="#e63946" letter-spacing="6" class="flick" transform="translate(4,0)" opacity=".85">ZARIXXX</text>
  <text x="46" y="178" font-family="Impact, 'Arial Black', sans-serif" font-size="112" fill="#f2f2f2" letter-spacing="6">ZARIXXX</text>

  <!-- tagline -->
  <rect x="48" y="206" width="420" height="2" fill="#e63946"/>
  <text x="48" y="238" font-family="'Courier New', monospace" font-size="20" fill="#f2f2f2" letter-spacing="3" font-weight="bold">IA <tspan fill="#e63946">//</tspan> CIBERSEGURIDAD <tspan fill="#e63946">//</tspan> BIG DATA</text>
  <text x="48" y="276" font-family="'Courier New', monospace" font-size="13" fill="#8a8a8a" letter-spacing="4">ENTUSIASTA DE LA INFORMÁTICA</text>
</svg>
